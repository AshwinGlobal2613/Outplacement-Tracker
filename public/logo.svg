    <ellipse cx="19" cy="30" rx="4" ry="1.5" fill="#FE5656" transform="rotate(-40 19 30)"/>
    <ellipse cx="9"  cy="41" rx="6" ry="2"   fill="#9C889B" transform="rotate(-12 9 41)"/>
    <ellipse cx="15" cy="39" rx="5" ry="1.8" fill="#FEDB99" transform="rotate(-28 15 39)"/>
    <ellipse cx="7"  cy="48" rx="5" ry="2"   fill="#BE3758" transform="rotate(-8 7 48)"/>
    <ellipse cx="13" cy="46" rx="4" ry="1.5" fill="#FE5656" transform="rotate(-20 13 46)"/>
  </g>

  <!-- Thin border rectangle around text -->
  <rect x="34" y="8" width="180" height="44" rx="0" fill="none" stroke="#BE3758" stroke-width="0.8"/>

  <!-- "Global" text — gray for "G·l·o·b·a" then berry for last "l" -->
  <text x="42" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="0.5">
    <tspan fill="#9C889B">Glob</tspan><tspan fill="#BE3758">al</tspan>
  </text>

  <!-- Subtitle -->
  <text x="42" y="48" font-family="Arial, Helvetica, sans-serif" font-size="6.5" fill="#9C889B" letter-spacing="1.8" font-weight="300">THE BUSINESS DESIGN COMPANY</text>
</svg>
