    <ellipse cx="14" cy="14" rx="6" ry="2" fill="#FE5656" transform="rotate(-30 14 14)"/>
    <ellipse cx="20" cy="11" rx="4" ry="1.8" fill="#FEDB99" transform="rotate(-50 20 11)"/>
    <ellipse cx="11" cy="20" rx="7" ry="2" fill="#9C889B" transform="rotate(-20 11 20)"/>
    <ellipse cx="17" cy="18" rx="5" ry="1.8" fill="#BE3758" transform="rotate(-35 17 18)"/>
    <ellipse cx="22" cy="16" rx="4" ry="1.5" fill="#332A3F" transform="rotate(-55 22 16)"/>
    <ellipse cx="9"  cy="27" rx="7" ry="2"   fill="#FE5656" transform="rotate(-15 9 27)"/>
    <ellipse cx="15" cy="25" rx="5" ry="1.8" fill="#FEDB99" transform="rotate(-30 15 25)"/>
    <ellipse cx="20" cy="23" rx="4" ry="1.5" fill="#9C889B" transform="rotate(-45 20 23)"/>
    <ellipse cx="8"  cy="34" rx="7" ry="2"   fill="#BE3758" transform="rotate(-10 8 34)"/>
